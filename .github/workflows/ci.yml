name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build both widgets (unsigned)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build executable
        shell: pwsh
        run: .\scripts\build-release.ps1 -App all -Version "ci"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UsageWidgets-unsigned
          path: |
            releases/ClaudeUsageWidget-ci.exe
            releases/CodexUsageWidget-ci.exe
          if-no-files-found: error
